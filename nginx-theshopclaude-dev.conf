# ============================================================
#  ShopClaude DEV Nginx Config
#  Place at: /etc/nginx/sites-available/theshopclaude-dev
#
#  Setup (run on server):
#    1. Point DNS at this VPS first:
#         dev.theshopclaude.com      -> 69.62.73.165 (A record)
#         *.dev.theshopclaude.com    -> 69.62.73.165 (A record)
#
#    2. Get wildcard SSL cert (DNS-01 challenge):
#         certbot certonly --manual --preferred-challenges dns \
#           --cert-name theshopclaude-dev-wildcard \
#           -d dev.theshopclaude.com -d "*.dev.theshopclaude.com"
#       (Add the TXT record shown to your DNS, then press Enter)
#
#    3. Copy frontend:
#         mkdir -p /var/www/theshopclaude-dev/frontend
#         scp -r dist/* root@69.62.73.165:/var/www/theshopclaude-dev/frontend/
#
#    4. Enable this config:
#         ln -s /etc/nginx/sites-available/theshopclaude-dev /etc/nginx/sites-enabled/
#         nginx -t && systemctl reload nginx
# ============================================================

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name dev.theshopclaude.com *.dev.theshopclaude.com;
    return 301 https://$host$request_uri;
}

# dev.theshopclaude.com — Landing & signup page
server {
    listen 443 ssl http2;
    server_name dev.theshopclaude.com;

    ssl_certificate     /etc/letsencrypt/live/theshopclaude-dev-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/theshopclaude-dev-wildcard/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root  /var/www/theshopclaude-dev/frontend;
    index index.html;

    location ^~ /gosuas-core/uploads/ {
        alias /var/www/theshopclaude-dev/uploads/;
    }

    location ^~ /gosuas-core/ {
        proxy_pass         http://127.0.0.1:8085/gosuas-core/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 15M;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# *.dev.theshopclaude.com — Tenant POS / online store
server {
    listen 443 ssl http2;
    server_name *.dev.theshopclaude.com;

    ssl_certificate     /etc/letsencrypt/live/theshopclaude-dev-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/theshopclaude-dev-wildcard/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root  /var/www/theshopclaude-dev/frontend;
    index index.html;

    location ^~ /gosuas-core/uploads/ {
        alias /var/www/theshopclaude-dev/uploads/;
    }

    location ^~ /gosuas-core/ {
        proxy_pass         http://127.0.0.1:8085/gosuas-core/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 15M;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
