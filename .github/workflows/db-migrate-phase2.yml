name: DB Migration — Phase 2 (one-off)

on:
  workflow_dispatch: {}

jobs:
  migrate:
    name: Phase 2 migration (DEV + Production)
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Trust VPS host key
        run: ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload migration SQL to VPS
        run: |
          scp backend/src/main/resources/db-migration-phase2.sql \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/db-migration-phase2.sql"

      - name: Run migration on DEV (shopclaude_dev_db)
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" bash -s <<'REMOTE'
          set -e
          echo "=== Phase 2 Migration — DEV ==="
          DB_PASS=$(grep '^DB_PASSWORD=' /etc/shopclaude-dev/shopclaude-dev.env | cut -d= -f2-)
          PGPASSWORD="$DB_PASS" psql -U shopclaude_dev_user -d shopclaude_dev_db \
            -f /tmp/db-migration-phase2.sql
          echo "=== DEV migration complete ==="
          REMOTE

      - name: Run migration on Production (shopclaude_db)
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" bash -s <<'REMOTE'
          set -e
          echo "=== Phase 2 Migration — Production ==="
          DB_PASS=$(grep '^DB_PASSWORD=' /etc/shopclaude/shopclaude.env | cut -d= -f2-)
          PGPASSWORD="$DB_PASS" psql -U shopclaude_user -d shopclaude_db \
            -f /tmp/db-migration-phase2.sql
          echo "=== Production migration complete ==="
          REMOTE

      - name: Clean up SQL file from VPS
        if: always()
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "rm -f /tmp/db-migration-phase2.sql" || true
