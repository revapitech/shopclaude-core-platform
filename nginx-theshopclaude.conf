# ============================================================
#  ShopClaude Nginx Config
#  Place at: /etc/nginx/sites-available/theshopclaude
#
#  Setup (run on server):
#    1. Get wildcard SSL cert (DNS-01 challenge):
#         apt install python3-certbot-nginx -y
#         certbot certonly --manual --preferred-challenges dns \
#           -d theshopclaude.com -d "*.theshopclaude.com"
#       (Add the TXT record shown to your DNS, then press Enter)
#
#    2. Copy frontend:
#         mkdir -p /var/www/theshopclaude/frontend
#         scp -r dist/* root@69.62.73.165:/var/www/theshopclaude/frontend/
#
#    3. Enable this config:
#         ln -s /etc/nginx/sites-available/theshopclaude /etc/nginx/sites-enabled/
#         nginx -t && systemctl reload nginx
# ============================================================

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name theshopclaude.com www.theshopclaude.com *.theshopclaude.com;
    return 301 https://$host$request_uri;
}

# www.theshopclaude.com — Landing & signup page
server {
    listen 443 ssl http2;
    server_name theshopclaude.com www.theshopclaude.com;

    ssl_certificate     /etc/letsencrypt/live/theshopclaude.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/theshopclaude.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root  /var/www/theshopclaude/frontend;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /gosuas-core/ {
        proxy_pass         http://127.0.0.1:8081/gosuas-core/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 15M;
    }
}

# *.theshopclaude.com — Tenant POS / online store
server {
    listen 443 ssl http2;
    server_name *.theshopclaude.com;

    ssl_certificate     /etc/letsencrypt/live/theshopclaude.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/theshopclaude.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root  /var/www/theshopclaude/frontend;
    index index.html;

    location /gosuas-core/uploads/ {
        alias /var/www/gosuas/uploads/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /gosuas-core/ {
        proxy_pass         http://127.0.0.1:8081/gosuas-core/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 15M;
    }
}
