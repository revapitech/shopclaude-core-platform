spring:
  application:
    name: gosuas-core-backend
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:noreply@theshopclaude.com}
    password: ${MAIL_PASSWORD:dummy}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  datasource:
    driverClassName: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gosuas_core_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /gosuas-core

upload:
  dir: ${UPLOAD_DIR:./uploads}

razorpay:
  key:
    id: ${RAZORPAY_KEY_ID:rzp_test_T1DLy98ruFoOhH}
    secret: ${RAZORPAY_KEY_SECRET:Zlv5OofDcpQ7ClQNUCpe943O}

jwt:
  secret: ${JWT_SECRET:gosuas-super-secret-jwt-signing-key-for-dev-only-2026}
  expiration-ms: ${JWT_EXPIRY_MS:86400000}

gosuas:
  init:
    admin-email: ${GOSUAS_ADMIN_EMAIL:admin@gosuas.com}
    admin-password: ${GOSUAS_ADMIN_PASSWORD:admin@123}
    superadmin-email: ${SC_SUPERADMIN_EMAIL:owner@theshopclaude.com}
    superadmin-password: ${SC_SUPERADMIN_PASSWORD:Sc@Admin2026#}