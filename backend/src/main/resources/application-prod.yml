spring:
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:noreply@theshopclaude.com}
    password: ${MAIL_PASSWORD:dummy}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME:gosuas_user}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${SERVER_PORT:8081}
  servlet:
    context-path: /gosuas-core

upload:
  dir: /var/www/gosuas/uploads

razorpay:
  key:
    id: ${RAZORPAY_KEY_ID}
    secret: ${RAZORPAY_KEY_SECRET}

jwt:
  # JWT_SECRET must be set via environment variable in production — no default is provided.
  # Minimum 32 characters. Generate with: openssl rand -base64 48
  secret: ${JWT_SECRET}
  expiration-ms: 86400000

gosuas:
  init:
    # Set SEED_GOSUAS_TENANT=false on fresh deployments that don't need the legacy Gosuas tenant.
    create-seed-tenant: ${SEED_GOSUAS_TENANT:true}
    admin-email: ${GOSUAS_ADMIN_EMAIL:admin@gosuas.com}
    admin-password: ${GOSUAS_ADMIN_PASSWORD:admin@123}
    superadmin-email: ${SC_SUPERADMIN_EMAIL:owner@theshopclaude.com}
    superadmin-password: ${SC_SUPERADMIN_PASSWORD:Sc@Admin2026#}
