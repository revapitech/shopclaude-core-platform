# ─────────────────────────────────────────────────────────────────────────────
#  ShopClaude DEV profile  (spring.profiles.active=shopclaude-dev)
#
#  Fully isolated from the shopclaude production profile: own port, own
#  database, own uploads directory. Deployed by
#  deploy/vps-deploy-shopclaude-dev.sh as the shopclaude-dev.service unit,
#  served at dev.theshopclaude.com / *.dev.theshopclaude.com.
#
#  Secrets are supplied via the EnvironmentFile at
#  /etc/shopclaude-dev/shopclaude-dev.env on the server — never committed here.
# ─────────────────────────────────────────────────────────────────────────────
spring:
  application:
    name: shopclaude-core-backend
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:noreply@theshopclaude.com}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
  datasource:

    driverClassName: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://localhost:5432/shopclaude_dev_db}
    username: ${DB_USERNAME:shopclaude_dev_user}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${SERVER_PORT:8085}
  servlet:
    context-path: /gosuas-core

upload:
  dir: ${UPLOAD_DIR:/var/www/theshopclaude-dev/uploads}

razorpay:
  mode: ${RAZORPAY_MODE:TEST}
  key:
    id: ${RAZORPAY_KEY_ID}
    secret: ${RAZORPAY_KEY_SECRET}

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRY_MS:86400000}

gosuas:
  init:
    create-seed-tenant: ${SEED_GOSUAS_TENANT:false}
    admin-email: ${ADMIN_EMAIL:admin@theshopclaude.com}
    admin-password: ${ADMIN_PASSWORD}
    superadmin-email: ${SUPERADMIN_EMAIL:owner@theshopclaude.com}
    superadmin-password: ${SUPERADMIN_PASSWORD}
